<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1A1A1A" />
  <title>EN•joy v6.0 — 縁を仕立て、続ける</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========== 初回UIモード選択モーダル（モダン / かんたん） ========== -->
  <div id="modal-ui-select" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet modal-sm">
      <div class="modal-head">
        <h2>EN•joy へようこそ</h2>
      </div>
      <div class="modal-body">
        <p class="lead-text">使いやすい画面スタイルを選んでください（あとからいつでも切替できます）</p>
        <div class="mode-pick-grid">
          <button type="button" class="mode-card" data-pick-ui="modern">
            <span class="mode-ico">⚡</span>
            <strong>モダン（標準）</strong>
            <span>写真中心・スッキリ高密度</span>
          </button>
          <button type="button" class="mode-card" data-pick-ui="simple">
            <span class="mode-ico">🔰</span>
            <strong>かんたん（大文字）</strong>
            <span>大きな文字・1列・迷わない</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== アプリ全体シェル ========== -->
  <div class="app-shell">

    <!-- PC用 左サイドバー（新・5タブ固定） -->
    <aside class="sidebar" aria-label="メインナビゲーション">
      <div class="sidebar-brand">
        <button type="button" class="brand-btn" data-tab="home">
          <svg class="brand-mark" viewBox="0 0 64 64" width="30" height="30" aria-hidden="true">
            <rect x="4" y="4" width="56" height="56" rx="4" fill="#1A1A1A" />
            <line x1="23" y1="22" x2="23" y2="27" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="square" />
            <line x1="41" y1="22" x2="41" y2="27" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="square" />
            <path d="M23 44 V35 C23 30 41 30 41 35 V44" fill="none" stroke="#C65D3B" stroke-width="4" stroke-linecap="square" />
          </svg>
          <span class="brand-title">EN•joy</span>
        </button>
        <span class="ver-tag">v6.0</span>
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="nav-item" data-tab="useful">
          <span class="nav-ico">🥬</span><span class="nav-label">役立ち</span>
        </button>
        <button type="button" class="nav-item" data-tab="plaza">
          <span class="nav-ico">💬</span><span class="nav-label">広場</span>
        </button>
        <button type="button" class="nav-item nav-item-en" data-tab="en">
          <span class="nav-ico">🤝</span><span class="nav-label">EN 出会い</span>
        </button>
        <button type="button" class="nav-item" data-tab="shop">
          <span class="nav-ico">🛍️</span><span class="nav-label">通販</span>
        </button>
        <button type="button" class="nav-item active" data-tab="home">
          <span class="nav-ico">🏠</span><span class="nav-label">ホーム</span>
          <span id="badge-home-pc" class="nav-dot hidden"></span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button type="button" id="btn-ui-mode-pc" class="side-util-btn">⚡ モダン / 🔰 かんたん</button>
        <button type="button" id="btn-focus-pc" class="side-util-btn">🚜 集中モード：OFF</button>
      </div>
    </aside>

    <!-- メインカラム -->
    <div class="main-wrap">

      <!-- トップヘッダー（3色ミニマル） -->
      <header class="top-header">
        <div class="header-left">
          <span class="brand-title mobile-only">EN•joy</span>
          <h1 id="page-title" class="page-title">🏠 ホーム</h1>
        </div>
        <div class="header-right">
          <button type="button" id="btn-ui-mode-mobile" class="icon-pill-btn mobile-only" title="UI切替">⚡/🔰</button>
          <button type="button" id="btn-open-chat" class="icon-pill-btn" title="チャット・受信箱">
            <span>💬</span><span id="badge-chat" class="pill-count">0</span>
          </button>
        </div>
      </header>

      <!-- メインコンテンツ -->
      <main class="app-main">

        <!-- ========================================================== -->
        <!-- 1. 左端：🥬 役立ち（旬レシピ・AI栄養 ／ 資材・神道具・協賛） -->
        <!-- ========================================================== -->
        <section id="tab-useful" class="tab-panel" aria-label="役立ち">
          <div class="seg-bar">
            <button type="button" class="seg-btn active" data-seg-group="useful" data-seg="shun">🥬 旬・レシピ</button>
            <button type="button" class="seg-btn" data-seg-group="useful" data-seg="plan">📅 1週間献立</button>
            <button type="button" class="seg-btn" data-seg-group="useful" data-seg="tools">🛠️ 資材・協賛</button>
          </div>

          <div id="useful-shun" class="seg-panel active"></div>
          <div id="useful-plan" class="seg-panel"></div>
          <div id="useful-tools" class="seg-panel"></div>
        </section>

        <!-- ========================================================== -->
        <!-- 2. 左2：💬 広場（SNS・小さい案件：画像付つぶやき ／ 動画）   -->
        <!-- ========================================================== -->
        <section id="tab-plaza" class="tab-panel" aria-label="広場">
          <div class="seg-bar">
            <button type="button" class="seg-btn active" data-seg-group="plaza" data-seg="feed">📝 つぶやき</button>
            <button type="button" class="seg-btn" data-seg-group="plaza" data-seg="shorts">🎬 15秒動画</button>
          </div>

          <!-- つぶやき（画像添付対応） -->
          <div id="plaza-feed" class="seg-panel active">
            <form id="form-feed" class="composer-box">
              <div class="composer-top">
                <select id="feed-tag" class="input input-compact">
                  <option value="余ってます">💡 余ってます</option>
                  <option value="困りごと">🆘 困りごと</option>
                  <option value="軽トラ便">🚚 軽トラ便</option>
                  <option value="現場メモ">📸 現場メモ</option>
                </select>
                <input type="text" id="feed-area" class="input input-compact" placeholder="地域（例：高槻）" />
              </div>
              <textarea id="feed-text" class="input textarea" rows="2" placeholder="いまの現場や、ちょっとした困りごとを投稿"></textarea>
              <div id="feed-img-preview" class="img-preview-wrap hidden"></div>
              <div class="composer-actions">
                <label class="btn btn-ghost btn-sm file-label">
                  📷 写真を追加
                  <input type="file" id="feed-img-input" accept="image/*" hidden />
                </label>
                <button type="submit" class="btn btn-accent btn-sm">投稿する</button>
              </div>
            </form>

            <div class="search-strip">
              <input type="search" id="feed-search" class="input" placeholder="🔍 キーワード・地域で検索" />
            </div>
            <div id="feed-list" class="feed-grid"></div>
          </div>

          <!-- 15秒動画 -->
          <div id="plaza-shorts" class="seg-panel"></div>
        </section>

        <!-- ========================================================== -->
        <!-- 3. 真ん中：🤝 EN（出会い・大きい案件：やりたいこと ／ 人・地図）-->
        <!-- ========================================================== -->
        <section id="tab-en" class="tab-panel" aria-label="EN 出会い">
          <div class="seg-bar">
            <button type="button" class="seg-btn active" data-seg-group="en" data-seg="ideas">🚀 やりたいこと募集</button>
            <button type="button" class="seg-btn" data-seg-group="en" data-seg="people">🤝 おすすめの人</button>
            <button type="button" class="seg-btn" data-seg-group="en" data-seg="map">🗺️ ご縁マップ</button>
          </div>

          <!-- やりたいこと・活用模索カード（大きい案件の起点） -->
          <div id="en-ideas" class="seg-panel active">
            <div class="action-bar">
              <button type="button" id="btn-open-new-idea" class="btn btn-accent">＋ やりたいこと・活用相談を募集する</button>
            </div>
            <div id="en-ideas-list" class="card-grid-2"></div>
          </div>

          <!-- おすすめの人・マッチング -->
          <div id="en-people" class="seg-panel"></div>

          <!-- ご縁めぐりマップ -->
          <div id="en-map" class="seg-panel"></div>
        </section>

        <!-- ========================================================== -->
        <!-- 4. 右2：🛍️ 通販（開発中・予約 ／ 完成品EC ／ 買い物帳）      -->
        <!-- ========================================================== -->
        <section id="tab-shop" class="tab-panel" aria-label="通販">
          <div class="seg-bar">
            <button type="button" class="seg-btn active" data-seg-group="shop" data-seg="wip">🧪 開発中・早割</button>
            <button type="button" class="seg-btn" data-seg-group="shop" data-seg="ec">🏮 EN•dress EC</button>
            <button type="button" class="seg-btn" data-seg-group="shop" data-seg="book">❤️ 買い物帳</button>
          </div>

          <div id="shop-wip" class="seg-panel active"></div>
          <div id="shop-ec" class="seg-panel"></div>
          <div id="shop-book" class="seg-panel"></div>
        </section>

        <!-- ========================================================== -->
        <!-- 5. 右端：🏠 ホーム（最上段に開発ルーム＆チャット ／ 個人設定） -->
        <!-- ========================================================== -->
        <section id="tab-home" class="tab-panel active" aria-label="ホーム">

          <!-- 最上段（一番目立つ場所）：進行中の開発ルーム -->
          <section class="home-hero-dev">
            <div class="section-head">
              <h2>🛠️ 進行中の開発ルーム</h2>
              <div class="btn-row">
                <button type="button" id="btn-new-room" class="btn btn-outline btn-sm">＋ 新規ルーム</button>
                <button type="button" id="btn-new-product" class="btn btn-outline btn-sm">＋ 商品追加</button>
              </div>
            </div>

            <!-- ルーム＆商品スイッチャー -->
            <div id="dev-room-tabs" class="chip-scroll"></div>
            <div id="dev-prod-tabs" class="chip-scroll"></div>

            <!-- 開発ルーム本体（4ミニタブでスッキリ整理） -->
            <div id="dev-workspace-box" class="dev-box">
              <div class="dev-box-head">
                <div>
                  <span id="dev-phase-tag" class="tag-accent">試作中</span>
                  <h3 id="dev-prod-title" class="dev-title">商品名</h3>
                </div>
                <select id="dev-phase-select" class="input input-compact">
                  <option value="企画中">企画中</option>
                  <option value="試作中">試作中</option>
                  <option value="準備OK">準備OK</option>
                  <option value="販売中">販売中</option>
                </select>
              </div>

              <!-- 開発ルーム内 4ミニタブ -->
              <div class="mini-tab-bar">
                <button type="button" class="mini-tab active" data-dev-tab="chat">💬 チャット</button>
                <button type="button" class="mini-tab" data-dev-tab="media">📸 試作・写真</button>
                <button type="button" class="mini-tab" data-dev-tab="cost">🧮 原価・資材</button>
                <button type="button" class="mini-tab" data-dev-tab="plan">📅 予定・印刷</button>
              </div>

              <div id="dev-pane-chat" class="dev-pane active"></div>
              <div id="dev-pane-media" class="dev-pane"></div>
              <div id="dev-pane-cost" class="dev-pane"></div>
              <div id="dev-pane-plan" class="dev-pane"></div>
            </div>
          </section>

          <!-- ホーム下段：個人メニュー（セグメント切替で縦長化を防止） -->
          <section class="home-my-area">
            <div class="seg-bar">
              <button type="button" class="seg-btn active" data-seg-group="home" data-seg="profile">👤 プロフィール・診断</button>
              <button type="button" class="seg-btn" data-seg-group="home" data-seg="ring">✍️ 年輪ボード</button>
              <button type="button" class="seg-btn" data-seg-group="home" data-seg="ops">⚙️ 設定・データ</button>
            </div>
            <div id="home-profile" class="seg-panel active"></div>
            <div id="home-ring" class="seg-panel"></div>
            <div id="home-ops" class="seg-panel"></div>
          </section>

        </section>

      </main>
    </div>
  </div>

  <!-- ========== スマホ用 下部5タブ固定ドック（新配置） ========== -->
  <nav class="mobile-dock" aria-label="モバイルナビゲーション">
    <button type="button" class="dock-item" data-tab="useful">
      <span class="dock-ico">🥬</span><span class="dock-label">役立ち</span>
    </button>
    <button type="button" class="dock-item" data-tab="plaza">
      <span class="dock-ico">💬</span><span class="dock-label">広場</span>
    </button>
    <button type="button" class="dock-item dock-center" data-tab="en">
      <span class="dock-en-mark">EN</span><span class="dock-label">出会い</span>
    </button>
    <button type="button" class="dock-item" data-tab="shop">
      <span class="dock-ico">🛍️</span><span class="dock-label">通販</span>
    </button>
    <button type="button" class="dock-item active" data-tab="home">
      <span class="dock-ico">🏠</span><span class="dock-label">ホーム</span>
      <span id="badge-home-mobile" class="dock-dot hidden"></span>
    </button>
  </nav>

  <!-- ========== モーダル群 ========== -->

  <!-- 1. やりたいこと・活用模索 新規募集モーダル -->
  <div id="modal-new-idea" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal="modal-new-idea"></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <h2>🚀 やりたいこと・活用相談を募集</h2>
        <button type="button" class="icon-close" data-close-modal="modal-new-idea">✕</button>
      </div>
      <div class="modal-body">
        <form id="form-new-idea" class="stack-form">
          <input type="text" id="idea-title" class="input" placeholder="タイトル（例：間伐ヒノキ端材の新しい活用法を一緒に探したい）" required />
          <div class="form-row-2">
            <select id="idea-cat" class="input">
              <option value="商品開発">🛠️ 商品開発</option>
              <option value="活用模索">💡 素材・技術の活用模索</option>
              <option value="イベント企画">🎪 イベント・販売企画</option>
            </select>
            <input type="text" id="idea-need" class="input" placeholder="組みたい相手（例：デザイナー・食品工房）" required />
          </div>
          <textarea id="idea-detail" class="input textarea" rows="4" placeholder="詳細（持っている素材・技術、実現したいイメージ、条件など）" required></textarea>
          <div class="form-actions-right">
            <button type="button" class="btn btn-outline" data-close-modal="modal-new-idea">閉じる</button>
            <button type="submit" class="btn btn-accent">募集カードを公開</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 2. 一括チャット・受信箱モーダル -->
  <div id="modal-chat" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal="modal-chat"></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <h2>💬 やり取り・お知らせ</h2>
        <button type="button" class="icon-close" data-close-modal="modal-chat">✕</button>
      </div>
      <div id="chat-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 3. 印刷プレビューモーダル -->
  <div id="modal-print" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal="modal-print"></div>
    <div class="modal-sheet modal-lg">
      <div class="modal-head no-print">
        <h2 id="print-title">🖨️ 印刷</h2>
        <div class="btn-row">
          <button type="button" id="btn-do-print" class="btn btn-accent btn-sm">印刷 / PDF</button>
          <button type="button" class="icon-close" data-close-modal="modal-print">✕</button>
        </div>
      </div>
      <div id="print-body" class="modal-body print-area"></div>
    </div>
  </div>

  <!-- トースト -->
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
